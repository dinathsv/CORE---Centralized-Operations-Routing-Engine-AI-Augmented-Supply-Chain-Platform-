services:

  postgres:
    image: postgres:15
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: core_admin
      POSTGRES_PASSWORD: core_secret
      POSTGRES_DB: core_main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_admin -d core_main"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: core-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - core-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: core-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - core-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: core-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - core-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: core-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_main
      SPRING_DATASOURCE_USERNAME: core_admin
      SPRING_DATASOURCE_PASSWORD: core_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - core-network

  inventory-service:
    build:
      context: ./backend/inventory-service
      dockerfile: Dockerfile
    container_name: core-inventory-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_inventory
      SPRING_DATASOURCE_USERNAME: core_admin
      SPRING_DATASOURCE_PASSWORD: core_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - core-network

  orders-service:
    build:
      context: ./backend/orders-service
      dockerfile: Dockerfile
    container_name: core-orders-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_orders
      SPRING_DATASOURCE_USERNAME: core_admin
      SPRING_DATASOURCE_PASSWORD: core_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    networks:
      - core-network

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: core-ai-agent
    restart: unless-stopped
    depends_on:
      - chromadb
      - kafka
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-your-api-key-here}
    ports:
      - "8090:8090"
    networks:
      - core-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: core-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    networks:
      - core-network

volumes:
  postgres_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
  chroma_data:
    driver: local

networks:
  core-network:
    driver: bridge
    name: core-network
