name: core

services:
  postgres:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-core_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-core_secret}
      POSTGRES_DB: core_main
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d core_main"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  chromadb:
    image: docker.io/chromadb/chroma:1.5.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  inventory-service:
    build:
      context: ./backend/inventory-service
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_inventory
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-core_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-core_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  orders-service:
    build:
      context: ./backend/orders-service
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-core_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-core_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      chromadb:
        condition: service_healthy
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3.8-flash}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway:
    build:
      context: ./gateway
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      inventory-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      ORDERS_SERVICE_URL: http://orders-service:8082
      AI_SERVICE_URL: http://ai-agent:8090
      CORE_ADMIN_USERNAME: ${CORE_ADMIN_USERNAME:-admin}
      CORE_ADMIN_PASSWORD: ${CORE_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  chroma_data:
