server:
  port: 8080

spring:
  application:
    name: core-gateway
  cloud:
    gateway:
      routes:
        - id: inventory-service
          uri: http://inventory-service:8081
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
        - id: orders-service
          uri: http://orders-service:8082
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: ai-agent
          uri: http://ai-agent:8090
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
  security:
    user:
      name: admin
      password: admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
