server:
  port: 8080

spring:
  application:
    name: core-gateway
  cloud:
    gateway:
      routes:
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/inventory,/api/inventory/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
        - id: orders-service
          uri: ${ORDERS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/orders,/api/orders/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
        - id: ai-agent
          uri: ${AI_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
            - RemoveRequestHeader=Authorization
      httpclient:
        connect-timeout: 5000
        response-timeout: 60s
  security:
    user:
      name: ${CORE_ADMIN_USERNAME:admin}
      password: ${CORE_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
